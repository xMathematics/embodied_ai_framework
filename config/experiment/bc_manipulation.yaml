# ═══════════════════════════════════════════════════════════════════════════════
# 行为克隆 (BC) 桌面操控实验配置
# ──────────────────────────────────────────────────────────────────────────────
# 本配置文件定义了使用行为克隆训练桌面操控策略的完整实验配置。
# 采用 Hydra 配置格式，支持层次化结构和命令行覆盖。
#
# 使用方式:
#   python train.py experiment=bc_manipulation
#   或直接:
#   python scripts/train.py --config config/experiment/bc_manipulation.yaml
# ═══════════════════════════════════════════════════════════════════════════════

# ── 实验基本设置 ─────────────────────────────────────────────────────────────
experiment_name: "bc_manipulation"
run_name: "bc_bridge_v2_v1"        # 运行名称，用于 MLflow 追踪
seed: 42                            # 随机种子，确保可复现性
log_file: "logs/bc_manipulation.log"

# ── 数据配置 ─────────────────────────────────────────────────────────────────
# ═══════════════════════════════════════════════════════════════════════════════
# 数据加载方式: 从本地路径加载
# ═══════════════════════════════════════════════════════════════════════════════
# data_dir: 【本地路径】标准化数据目录
#   - 指向 prepare_data.py 预处理后的 Arrow 文件目录
#   - 支持相对路径 (相对于项目根目录) 和绝对路径
#   - 示例:
#       相对路径: "data/unified/bridge_v2"
#       绝对路径: "/mnt/nvme/data/bridge_v2"
#       环境变量: "${DATA_ROOT}/bridge_v2" (需 Hydra 启用环境变量解析)
#   - 如果该目录不存在或为空，运行 prepare_data.py 生成:
#     python scripts/prepare_data.py --datasets=bridge_v2 --local_path=data/unified/bridge_v2
#
# registry_path: 数据集注册表路径 (用于查询默认路径和元信息)
# batch_size: 批次大小 (VLA 模型建议 8-16，BC/ACT 建议 128-256)
# num_workers: 数据加载进程数 (SSD 建议 4-8，NVMe 建议 8-16)
# ═══════════════════════════════════════════════════════════════════════════════
data:
  registry_path: "config/dataset/registry.yaml"   # 数据集注册表
  data_dir: "data/unified/bridge_v2"               # ← 本地路径: 箭头文件目录
  dataset_name: "bridge_v2"                        # 数据集名称 (用于查询 registry)
  batch_size: 256                                  # 训练批次大小
  num_workers: 4                                   # 数据加载工作进程数
  augment: true                                    # 是否启用数据增强
  augment_config:                                  # 增强参数
    crop_scale: [0.9, 1.0]
    brightness: 0.1
    contrast: 0.1
    noise_std: 0.01

# ── 仿真配置 ─────────────────────────────────────────────────────────────────
simulation:
  backend: "mujoco"                   # 仿真后端 (mujoco / isaac_sim / pybullet)
  time_step: 0.002                    # 仿真步长 (s)
  max_steps: 500                      # 每个 episode 最大步数
  render_width: 128
  render_height: 128
  randomize: true                     # 领域随机化
  randomize_config:
    lighting: true
    physics: true
    friction_range: [0.2, 1.5]

# ── 训练配置 ─────────────────────────────────────────────────────────────────
training:
  algorithm: "bc"                     # 训练算法 (bc / act / diffusion / ppo / sac)
  num_epochs: 100                     # 训练轮数
  obs_dim: 128                        # 观测特征维度
  action_dim: 7                       # 动作维度
  learning_rate: 0.0001               # 学习率
  weight_decay: 0.00001               # 权重衰减 (L2 正则化)
  save_every: 10                      # 每 N 个 epoch 保存检查点
  checkpoint_dir: "checkpoints/bc"

# ── 评估配置 ─────────────────────────────────────────────────────────────────
evaluation:
  num_episodes: 50                    # 评估回合数
  render: true                        # 是否渲染视频
  video_dir: "videos/bc_eval"
  save_results: true
  metrics:
    - success_rate
    - avg_reward
    - avg_episode_length
