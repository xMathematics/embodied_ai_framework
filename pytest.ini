# ═══════════════════════════════════════════════════════════════════════════════
# Pytest 配置文件 (pytest.ini)
# ──────────────────────────────────────────────────────────────────────────────
# 定义了全局的 pytest 运行参数。
#
# 常用命令:
#   运行全部测试:          pytest -v
#   运行特定文件:          pytest libs/python/framework/tests/data/test_registry.py -v
#   运行特定测试:          pytest -k "test_loss_decreases" -v
#   显示 print 输出:       pytest -v -s
#   生成覆盖率报告:        pytest --cov=libs/python/framework/src --cov-report=html
#   失败则停:             pytest -x
# ═══════════════════════════════════════════════════════════════════════════════

[pytest]
# ── 测试发现规则 ─────────────────────────────────────────────────────────────
# Python 文件匹配模式 (默认 test_*.py)
python_files = test_*.py

# 测试类匹配模式
python_classes = Test*

# 测试方法匹配模式
python_functions = test_*

# ── 测试路径 ─────────────────────────────────────────────────────────────────
# 指定测试文件的根目录 (Python 框架已迁至 libs/python/framework)
testpaths = libs/python/framework/tests

# ── 标记注册 ─────────────────────────────────────────────────────────────────
# 注册自定义标记 (marker)，避免 "unknown marker" 警告
markers =
    slow: 运行时间较长的测试 (如 RL 训练收敛性测试)
    integration: 需要外部依赖的集成测试 (如连接真实仿真引擎)
    gpu: 需要 GPU 的测试
